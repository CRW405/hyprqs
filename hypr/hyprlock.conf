# Minimal hyprlock config matching this repo's shared style tokens
# (style/style.json). Deliberately flat: no blur, shadows, or animations,
# matching hyprland.lua's decoration/animations settings.

# $font is rewritten in place by hypr/scripts/SyncHyprlockFont.sh from style.json's font.family
$font = Departure Mono

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(1c1c1e)
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(d4d4d8)
    position = 0, 60
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = rgb(6a6a72)
    position = 0, -30
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 50
    rounding = 0
    outline_thickness = 1
    outer_color = rgb(6e6e78)
    inner_color = rgb(3a3a40)
    font_color = rgb(d4d4d8)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -120
    halign = center
    valign = center
}
