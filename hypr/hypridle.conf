$hyprlockConf = $HOME/.config/hypr/hypr/hyprlock.conf

general {
    # -c is required: our hyprlock.conf isn't at hyprlock's default path
    # (~/.config/hypr/hyprlock.conf), so without it hyprlock prints
    # "Could not find config" and exits instead of locking.
    lock_cmd = pidof hyprlock || hyprlock -c $hyprlockConf &
    before_sleep_cmd = pidof hyprlock || hyprlock -c $hyprlockConf & sleep 1
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Warning: 9 minutes idle (1 minute before lock)
listener {
    timeout = 540
    on-timeout = notify-send -u normal "Locking soon" "Screen locks in 1 minute of inactivity." 2>/dev/null || true
}

# Lock: 10 minutes idle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
